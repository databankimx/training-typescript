<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Leave a comment</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main>
      <h1>Leave a comment</h1>
      <form id="comment-form">
        <label for="comment">Comment</label>
        <textarea id="comment" rows="3"></textarea>

        <fieldset class="challenge">
          <legend>Prove you are a person</legend>
          <p id="question"></p>
          <label for="answer">Your answer</label>
          <input id="answer" type="text" inputmode="numeric" autocomplete="off">
          <button id="new-question" type="button">New question</button>
        </fieldset>

        <div class="actions">
          <button type="submit">Submit</button>
          <button id="bot" type="button">Simulate a bot</button>
        </div>
      </form>
      <p id="status" role="status"></p>
      <ul id="saved"></ul>
    </main>
    <script type="module" src="main.js"></script>
  </body>
</html>
