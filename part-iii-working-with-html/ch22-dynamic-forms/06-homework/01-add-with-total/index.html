<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Basket</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <form id="add-form" novalidate>
      <label>Item <input id="name" type="text"></label>
      <label>Price <input id="price" type="number" step="0.01" min="0"></label>
      <button type="submit">Add</button>
    </form>
    <ul id="items"></ul>
    <p id="total">Total: 0</p>
    <script type="module" src="main.js"></script>
  </body>
</html>
